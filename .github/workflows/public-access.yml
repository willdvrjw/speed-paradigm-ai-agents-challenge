name: Public browser access

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/public-access.yml']

permissions:
  contents: read

jobs:
  webkit:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      TEST_BASE_URL: https://speed-paradigm-ai-agents-challenge.vercel.app
      PLAYWRIGHT_ACCESS_SMOKE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Verify public WebKit mobile access
        run: npx playwright test --project=webkit-mobile
